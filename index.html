<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f12"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>Hoop Hauls</title></head><body><header><div class="brand"><b>HOOP HAULS</b><span id="syncStatus">Ready</span></div></header><main><div class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="deal">Deal Calc</button><button class="tab" data-tab="inventory">Inventory</button><button class="tab" data-tab="add">Add Pair</button><button class="tab" data-tab="sold">Sold</button><button class="tab" data-tab="expense">Expense</button></div><section id="dashboard" class="panel active"><div class="grid"><div class="card metric"><small>Business Cash</small><strong id="cash">₱0</strong></div><div class="card metric"><small>Inventory Cost</small><strong id="inventoryValue">₱0</strong></div><div class="card metric"><small>Realized Profit</small><strong id="profit">₱0</strong></div><div class="card metric"><small>Pairs Available</small><strong id="pairCount">0</strong></div></div><div class="card"><button id="syncBtn">Sync with Sheets</button><p class="note">Connected to Hoop Hauls Bookkeeping through Google Apps Script.</p></div></section><section id="deal" class="panel"><div class="card"><h2>Deal Calculator</h2><div class="row"><div><label>Seller ask</label><input id="dAsk" type="number" value="5000"></div><div><label>Expected sale</label><input id="dSale" type="number" value="8000"></div></div><div class="row"><div><label>Extra costs</label><input id="dExtra" type="number" value="0"></div><div><label>Target ROI %</label><input id="dTarget" type="number" value="30"></div></div><label>Condition</label><select id="dCondition"><option value="ds">Brand New / DS</option><option value="like">Like New</option><option value="light" selected>Lightly Used</option><option value="used">Used / Cleanable</option><option value="heavy">Heavy / Permanent Flaws</option></select><label>Inclusions</label><select id="dInclusions"><option value="ogreceipt">OG Box + Receipt</option><option value="og">OG Box</option><option value="repreceipt">Rep Box + Receipt</option><option value="rep">Rep Box</option><option value="noreceipt">No Box + Receipt</option><option value="none">No Box / No Receipt</option></select><div id="decision" class="decision">—</div><div class="grid"><div class="card metric"><small>Expected Profit</small><strong id="dealProfit">₱0</strong></div><div class="card metric"><small>Expected ROI</small><strong id="dealRoi">0%</strong></div></div><p class="note">Suggested max offer: <b id="maxOffer">₱0</b></p></div></section><section id="inventory" class="panel"><div class="card"><h2>Available Inventory</h2><div id="inventoryList"></div></div></section><section id="add" class="panel"><div class="card"><h2>Add Pair</h2><label>Shoe / colorway</label><input id="aShoe" placeholder="Kobe 9 Halo"><div class="row"><div><label>Size</label><input id="aSize" placeholder="US 9M"></div><div><label>Supplier</label><input id="aSupplier" placeholder="Carousell"></div></div><div class="row"><div><label>Purchase cost</label><input id="aCost" type="number"></div><div><label>Other cost</label><input id="aOther" type="number" value="0"></div></div><label>Condition</label><select id="aCondition"><option>Brand New / DS</option><option>Like New</option><option selected>Lightly Used</option><option>Used / Cleanable</option><option>Heavy / Permanent Flaws</option></select><div class="row"><div><label>Box</label><select id="aBox"><option>OG Box</option><option>Rep Box</option><option>No Box</option></select></div><div><label>Receipt / proof</label><select id="aReceipt"><option>Yes</option><option>No</option></select></div></div><div class="row"><div><label>Listing price</label><input id="aList" type="number"></div><div><label>Floor price</label><input id="aFloor" type="number"></div></div><label>Notes</label><textarea id="aNotes"></textarea><button id="addPairBtn">Save Pair</button></div></section><section id="sold" class="panel"><div class="card"><h2>Sold Pairs</h2><div id="soldList"></div></div></section><section id="expense" class="panel"><div class="card"><h2>Add Expense</h2><label>Category</label><input id="eCategory" placeholder="Transport / Packaging / Ads"><label>Description</label><input id="eDescription"><label>Amount</label><input id="eAmount" type="number"><div class="row"><div><label>Paid by</label><select id="ePaid"><option>Business</option><option>Antonio</option><option>Karl</option></select></div><div><label>Payment method</label><input id="eMethod" placeholder="Cash / GCash"></div></div><label>Notes</label><textarea id="eNotes"></textarea><button id="expenseBtn">Save Expense</button></div></section></main><script src="app.js"></script></body></html>
